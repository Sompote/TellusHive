# XcodeGen spec: `xcodegen generate` makes TellusHive.xcodeproj from this file.
name: TellusHive
options:
  bundleIdPrefix: com.tellushive
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # your Apple team ID (Xcode › Signing & Capabilities fills it in)
targets:
  TellusHive:
    type: application
    platform: iOS
    sources: [TellusHive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tellushive.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TellusHive
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Take site photos to send to your bots."
    info:
      path: TellusHive/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
