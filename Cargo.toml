[workspace]
resolver = "2"
members = ["crates/llm", "crates/mcp", "crates/kb", "crates/eng", "crates/hive", "crates/harness", "app"]
default-members = ["crates/llm", "crates/mcp", "crates/kb", "crates/eng", "crates/hive", "crates/harness", "app"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
base64 = "0.22"
regex = "1"
dirs = "6"

[profile.release]
opt-level = 3
